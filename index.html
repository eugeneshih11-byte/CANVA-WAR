<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CANVA WAR</title>
  <link rel="stylesheet" href="style.css?v=2">
</head>
<body>
  <main class="app">
    <section id="startScreen" class="start-screen">
      <h1>CANVA WAR</h1>
      <button id="playButton" type="button">Play</button>
    </section>

    <section id="gameInterface" class="game-screen" hidden>
      <header class="hud">
        <div class="hud-player"><span>HP: <strong id="hpValue"></strong></span>
          <span>Level: <strong id="levelValue"></strong> · XP: <strong id="xpValue"></strong></span></div>
        <div class="hud-stage"><strong id="stageValue">STAGE 1</strong><span id="waveValue">WAVE 1 / 5</span></div>
        <div class="hud-score"><span>Score: <strong id="scoreValue"></strong></span>
          <button id="abandonButton" type="button">Abandon</button></div>
      </header>

      <div class="main-game-layout">
        <div class="canvas-area">
          <div id="abandonOverlay" class="abandon-overlay" role="dialog" aria-modal="true" aria-label="Abandon run" hidden>
            <h2>Abandon this run?</h2><p>Only the last cleared encounter is secured.</p>
            <button id="continueButton" type="button">CONTINUE</button>
            <button id="confirmAbandonButton" type="button">ABANDON RUN</button>
          </div>
          <div id="upgradeOverlay" class="upgrade-overlay" role="dialog" aria-modal="true" aria-labelledby="upgradeTitle" aria-describedby="upgradeMessage" hidden>
            <div class="upgrade-dialog">
              <h2 id="upgradeTitle">LEVEL UP</h2>
              <p id="upgradeMessage">Choose one upgrade. Press 1, 2, or 3.</p>
              <div id="upgradeChoices" class="upgrade-choices"></div>
            </div>
          </div>
          <canvas id="gameCanvas" width="800" height="600"></canvas>
        </div>

        <aside class="inventory-area build-panel" aria-labelledby="buildTitle">
          <h2 id="buildTitle">BUILD</h2>
          <dl class="build-stats">
            <div class="build-weapon-row"><dt>Weapon</dt><dd id="buildWeaponName">Starter</dd></div>
            <div><dt>Damage</dt><dd id="buildDamage">1</dd></div>
            <div><dt>Fire rate</dt><dd id="buildFireRate">4.0/s</dd></div>
            <div><dt>Projectiles</dt><dd id="buildProjectileCount">1</dd></div>
            <div><dt>Move speed</dt><dd id="buildMoveSpeed">240</dd></div>
            <div><dt>Max HP</dt><dd id="buildMaxHp">5</dd></div>
          </dl>
          <h3>Upgrades</h3>
          <ul id="buildUpgradeList" class="build-upgrade-list">
            <li class="build-empty">No upgrades yet.</li>
          </ul>
        </aside>
      </div>
    </section>
  </main>

  <script src="settlement.js"></script>
  <script src="encounters.js"></script>
  <script src="weapons.js"></script>
  <script src="build.js"></script>
  <script src="telemetry.js"></script>
  <script src="telemetry-ui.js"></script>
  <script src="game.js"></script>
</body>
</html>
